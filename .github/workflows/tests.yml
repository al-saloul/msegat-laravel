name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['9.*', '10.*', '11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '9.*'
            testbench: '7.*'
          - laravel: '10.*'
            testbench: '8.*'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 10 needs PHP 8.1+, Laravel 11 and 12 need 8.2+, Laravel 13 needs 8.3+
          - { laravel: '10.*', php: '8.0' }
          - { laravel: '11.*', php: '8.0' }
          - { laravel: '11.*', php: '8.1' }
          - { laravel: '12.*', php: '8.0' }
          - { laravel: '12.*', php: '8.1' }
          - { laravel: '13.*', php: '8.0' }
          - { laravel: '13.*', php: '8.1' }
          - { laravel: '13.*', php: '8.2' }
          # Older releases predate the newer runtimes and are not supported on them upstream
          - { laravel: '9.*', php: '8.3' }
          - { laravel: '9.*', php: '8.4' }
          - { laravel: '9.*', php: '8.5' }
          - { laravel: '10.*', php: '8.5' }
          - { laravel: '11.*', php: '8.5' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, json, libxml, mbstring, xml
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  validate:
    runs-on: ubuntu-latest
    name: Validate composer.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
